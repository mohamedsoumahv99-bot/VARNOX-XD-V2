services:
  - type: web
    name: varnox-xd-v2
    env: node
    plan: starter
    disk:
      name: varnox-sessions
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1
    autoDeploy: true
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: OWNER_NUMBER
        sync: false
      - key: SESSION_DIR
        value: /opt/render/project/src/sessions
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: varnox-xd-v2
          property: host
